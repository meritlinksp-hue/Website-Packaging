<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nirin Packaging</title>
    <link rel="stylesheet" href="./assets/index-dowarvtz.css">
    <link rel="modulepreload" href="./assets/index-hcOR4-hu.js">
</head>
<body>
    <div id="root"></div>

    <!-- จำลอง State Context สำหรับ Remix / React Router SPA Runtime -->
    <script>
        window.__remixContext = {
            url: window.location.pathname,
            state: {
                loaderData: {},
                actionData: null,
                errors: null
            },
            future: {
                v3_fetcherPersist: true,
                v3_relativeSplatPath: true,
                v3_throwAbortReason: true,
                v3_singleFetch: false,
                v3_lazyRouteDiscovery: false
            },
            isSpaMode: true
        };
        window.__staticRouterHydrationData = {
            loaderData: {},
            actionData: null,
            errors: null
        };
    </script>

    <script type="module" src="./assets/index-hcOR4-hu.js"></script>
</body>
</html>
